{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/admin" class="text-decoration-none text-secondary">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="/admin/menu" class="text-decoration-none text-secondary">Menu</a></li>
            <li class="breadcrumb-item active">Edit Item</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <h2 class="fw-bold mb-4" style="font-family: 'Playfair Display';">Edit Dish Details</h2>
                
                <form method="POST" action="{{ url_for('edit_menu_item', item_id=item.id) }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Dish Name</label>
                        <input type="text" name="name" class="form-control rounded-pill" value="{{ item.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Category</label>
                        <select name="category_id" class="form-select rounded-pill" required>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if cat.id == item.category_id %}selected{% endif %}>
                                {{ cat.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Price (Rs.)</label>
                        <input type="number" name="price" class="form-control rounded-pill" value="{{ item.price }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small">Description (Optional)</label>
                        <textarea name="description" class="form-control rounded-4" rows="3">{{ item.description }}</textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary rounded-pill py-2 fw-bold">Update Dish</button>
                        <a href="/admin/menu" class="btn btn-light rounded-pill py-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .rounded-4 { border-radius: 1rem !important; }
    .form-control:focus, .form-select:focus {
        border-color: #0d6efd;
        box-shadow: none;
    }
</style>
{% endblock %}
