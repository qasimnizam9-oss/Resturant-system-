{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg rounded-4 p-4">
                <div class="text-center mb-4">
                    <div class="icon-box bg-danger-soft mb-3 d-inline-block p-3 rounded-circle">
                        <i class="bi bi-shield-lock text-danger h1"></i>
                    </div>
                    <h2 class="fw-bold">Security Settings</h2>
                    <p class="text-muted">Update your administrator password</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">New Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Confirm New Password</label>
                        <input type="password" name="confirm_password" class="form-control form-control-lg" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 btn-lg rounded-pill">Update Password</button>
                    <a href="{{ url_for('admin') }}" class="btn btn-link w-100 mt-2 text-muted text-decoration-none">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-danger-soft { background: #fff1f2; }
    .form-control:focus { border-color: #c5a059; box-shadow: 0 0 0 0.25rem rgba(197, 160, 89, 0.25); }
</style>
{% endblock %}
