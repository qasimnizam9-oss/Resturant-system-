{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4 p-4">
                <h2 class="text-center mb-2" style="font-family: 'Playfair Display';">Book a Table</h2>
                <p class="text-center text-muted mb-4">Secure your spot for an unforgettable dining experience.</p>
                
                <form action="/reserve" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Phone Number</label>
                            <input type="tel" name="phone" class="form-control" placeholder="+1 234 567" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Date</label>
                            <input type="date" name="date" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Time</label>
                            <input type="time" name="time" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Number of Guests</label>
                        <select name="guests" class="form-select">
                            <option value="1">1 Person</option>
                            <option value="2" selected>2 People</option>
                            <option value="3">3 People</option>
                            <option value="4">4 People</option>
                            <option value="5">5 People</option>
                            <option value="6">6+ People</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Special Requests (Optional)</label>
                        <textarea name="requests" class="form-control" rows="3" placeholder="Allergies, anniversary, or quiet table requests..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 py-3 fw-bold shadow-sm mt-3">
                        Confirm Reservation
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        background-color: #ffffff;
        transition: transform 0.3s ease;
    }
    .form-control:focus, .form-select:focus {
        border-color: #ffc107;
        box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
    }
</style>
{% endblock %}
