{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow border-0">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4" style="font-family: 'Playfair Display';">Staff Login</h2>
                    
                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        <div class="alert alert-danger small">{{ messages[0] }}</div>
                      {% endif %}
                    {% endwith %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold">Enter Dashboard</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
