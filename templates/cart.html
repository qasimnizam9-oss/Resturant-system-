{% extends 'base.html' %}

{% block content %}
<div class="container py-5" style="min-height: 80vh;">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <h2 class="mb-4 text-center" style="font-family: 'Playfair Display';">Your Gourmet Selection</h2>
            
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div id="cart-items-list" class="mb-4">
                        </div>

                    <div id="empty-cart-msg" class="text-center py-5 d-none">
                        <i class="bi bi-cart-x display-1 text-muted"></i>
                        <p class="lead mt-3">Your cart is as empty as a plate after a great meal.</p>
                        <a href="/menu" class="btn btn-dark px-4 mt-2">Back to Menu</a>
                    </div>

                    <div id="cart-footer" class="border-top pt-4 mt-4">
                        <div class="row align-items-center">
                            <div class="col-md-6">
                                <h3 class="fw-bold mb-0">Total: <span class="text-success">$<span id="cart-total">0.00</span></span></h3>
                            </div>
                            <div class="col-md-6 text-md-end mt-3 mt-md-0">
                                <a href="/menu" class="btn btn-outline-dark me-2">Continue Shopping</a>
                                <button onclick="sendOrder()" id="order-btn" class="btn btn-warning btn-lg fw-bold shadow-sm">
                                    Place Order Now
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * Renders the cart items from LocalStorage
     */
    function displayCart() {
        const cart = JSON.parse(localStorage.getItem('restaurantCart')) || [];
        const list = document.getElementById('cart-items-list');
        const footer = document.getElementById('cart-footer');
        const emptyMsg = document.getElementById('empty-cart-msg');
        let total = 0;
        
        // Handle Empty State
        if (cart.length === 0) {
            list.innerHTML = '';
            footer.classList.add('d-none');
            emptyMsg.classList.remove('d-none');
            return;
        }

        // Show cart contents
        footer.classList.remove('d-none');
        emptyMsg.classList.add('d-none');
        list.innerHTML = '';

        cart.forEach((item, index) => {
            total += item.price;
            list.innerHTML += `
                <div class="d-flex justify-content-between align-items-center py-3 border-bottom cart-item">
                    <div class="d-flex align-items-center">
                        <div class="bg-light rounded p-2 me-3">
                            <i class="bi bi-egg-fried text-warning fs-4"></i>
                        </div>
                        <div>
                            <h5 class="mb-0 fw-bold">${item.name}</h5>
                            <span class="text-muted small">$${item.price.toFixed(2)}</span>
                        </div>
                    </div>
                    <button onclick="removeItem(${index})" class="btn btn-link text-danger p-0">
                        <i class="bi bi-trash"></i> Remove
                    </button>
                </div>`;
        });
        
        document.getElementById('cart-total').innerText = total.toFixed(2);
    }

    /**
     * Removes an item from the cart
     */
    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('restaurantCart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('restaurantCart', JSON.stringify(cart));
        displayCart();
        // Update the badge in the navbar if it exists
        if(window.updateCartCount) updateCartCount();
    }

    /**
     * Sends the order to the Flask Backend
     */
    async function sendOrder() {
        const cart = JSON.parse(localStorage.getItem('restaurantCart')) || [];
        const btn = document.getElementById('order-btn');
        
        if (cart.length === 0) return;

        // Disable button to prevent double clicks
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing...';

        try {
            const response = await fetch('/checkout', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({cart: cart})
            });
            
            const result = await response.json();
            
            if(result.status === 'success') {
                // Use our professional Toast if available, otherwise alert
                alert("Chef's kiss! Your order has been received.");
                localStorage.removeItem('restaurantCart');
                window.location.href = '/';
            } else {
                alert("Error: " + result.message);
                btn.disabled = false;
                btn.innerText = 'Place Order Now';
            }
        } catch (error) {
            console.error("Order Error:", error);
            alert("Something went wrong. Please check your connection.");
            btn.disabled = false;
            btn.innerText = 'Place Order Now';
        }
    }

    // Initialize on load
    window.onload = displayCart;
</script>

<style>
    .cart-item {
        transition: all 0.3s ease;
    }
    .cart-item:hover {
        background-color: #f8f9fa;
        padding-left: 10px;
        padding-right: 10px;
        border-radius: 8px;
    }
</style>
{% endblock %}
